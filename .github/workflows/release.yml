# v* 태그를 push하면 자동 업데이트용 asset을 릴리스에 올린다.
#
# 여기서 올리는 것은 **업데이트용 raw exe와 그 체크섬 둘뿐이다.**
# 최초 사용자용 full zip(exe + eztrans_dll/)은 사람이 직접 같은 릴리스에 추가한다.
#
# eztrans_dll/을 이 워크플로에 절대 추가하지 마라. 사용자가 편집하는 사전
# (Ehnd/UserDict_*.txt, Ehnd/ehnd_conf.ini)이 들어 있어
# 업데이트로 덮어쓰면 사용자 데이터가 사라지고, 재배포도 라이선스상 민감하다.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # 버전 검증을 가장 먼저 한다. 버전 bump를 잊고 태그만 올리면 앱은
      # 영원히 새 버전을 찾지 못하는데, 증상이 "아무 일도 안 일어남"이라
      # 원인 파악이 매우 어렵다. 빌드 시간을 쓰기 전에 여기서 끊는다.
      - name: 태그와 Cargo.toml 버전이 일치하는지 확인
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          # 의존성에도 version 줄이 있으므로 [package] 섹션으로 한정한다.
          # 줄 순서에 기대면 Cargo.toml을 재배치했을 때 조용히 틀린 값을 읽는다.
          $matched = [regex]::Match(
              (Get-Content -Raw Cargo.toml),
              '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"')
          if (-not $matched.Success) {
              throw 'Cargo.toml의 [package] 버전을 찾지 못했습니다.'
          }
          $manifest = $matched.Groups[1].Value
          if ($tag -ne $manifest) {
              throw "태그($tag)와 Cargo.toml 버전($manifest)이 다릅니다."
          }
          Write-Host "버전 확인: $manifest"

      # asset 이름은 src/update/mod.rs가 유일한 출처다. 여기에 문자열을
      # 다시 적으면 코드와 CI가 조용히 어긋나고, 그 결과는 "업데이트 없음"이라
      # 발견이 늦어진다. 상수에서 읽어와 어긋날 여지를 없앤다.
      - name: asset 이름을 소스 상수에서 읽기
        id: names
        shell: pwsh
        run: |
          $source = Get-Content -Raw src/update/mod.rs
          $asset = [regex]::Match(
              $source, 'UPDATE_ASSET_NAME:\s*&str\s*=\s*"([^"]+)"').Groups[1].Value
          $checksum = [regex]::Match(
              $source, 'CHECKSUM_ASSET_NAME:\s*&str\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $asset -or -not $checksum) {
              throw 'src/update/mod.rs에서 asset 이름 상수를 찾지 못했습니다.'
          }
          "asset=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "checksum=$checksum" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "업데이트 asset: $asset"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      # --target은 넘기지 않는다. .cargo/config.toml이 build.target을
      # x86_64-pc-windows-msvc로 고정하고 verify-release.ps1도 그 경로를 본다.
      - run: cargo build --release --locked

      # PE subsystem이 GUI(2)인지 확인한다. 콘솔 창이 뜨는 exe를 배포하면
      # 사용자가 바로 알아채므로 여기서 막는다.
      - shell: pwsh
        run: ./scripts/verify-release.ps1

      - name: asset과 체크섬 준비
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $built = 'target/x86_64-pc-windows-msvc/release/anemone_rs.exe'
          $asset = Join-Path dist '${{ steps.names.outputs.asset }}'
          Copy-Item -LiteralPath $built -Destination $asset

          # 앱의 parse_checksum이 읽는 형식: "<sha256 hex>  <파일명>"
          # (구분자는 공백 2칸. scripts/verify-release.ps1의 매니페스트와 같다.)
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          $line = "$hash  ${{ steps.names.outputs.asset }}"
          $checksum = Join-Path dist '${{ steps.names.outputs.checksum }}'
          [System.IO.File]::WriteAllText($checksum, "$line`n")
          Write-Host $line

      # full zip은 사람이 나중에 같은 릴리스에 추가한다.
      # action-gh-release는 기존 asset을 지우지 않으므로 순서는 상관없다.
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ steps.names.outputs.asset }}
            dist/${{ steps.names.outputs.checksum }}
