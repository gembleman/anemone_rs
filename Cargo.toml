[package]
name = "anemone_rs"
version = "0.1.0"
edition = "2024"

[features]
default = []
benchmark = []

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Controls_RichEdit",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
windows-numerics = "0.3"
# `windows::core::implement`의 COM 코드 생성물이 `::windows_core`를 참조한다.
windows-core = "0.62"
eztrans-rs = { git = "https://github.com/gembleman/eztrans-rs.git", rev = "bf67b8935bed7ff7701319c782eb8645f7ae415d" }
isolang = { version = "2.4" }
time = { version = "0.3", default-features = false, features = ["local-offset"] }

# Error handling & logging
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
] }

# Async translation support
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
reqwest = { version = "0.13", features = [
    "json",
    "native-tls",
    "form",
], default-features = false }
rpassword = "7.4"
httpdate = "1.0"

[build-dependencies]
winresource = "0.1"

[profile.release]
# 최종 GUI 배포물은 증분 빌드보다 실행 성능과 크기를 우선한다.
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
