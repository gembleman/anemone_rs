[package]
name = "anemone_rs"
version = "0.1.1"
edition = "2024"
authors = ["gembleman"]
repository = "https://github.com/gembleman/anemone_rs.git"

[features]
default = []
benchmark = []

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Controls_RichEdit",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    # 업데이트 asset 무결성 검증(SHA-256)에 CNG를 쓴다. 해시 crate를 새로
    # 추가하지 않기 위한 선택이다.
    "Win32_Security_Cryptography",
]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
windows-numerics = "0.3"
# `windows::core::implement`의 COM 코드 생성물이 `::windows_core`를 참조한다.
windows-core = "0.62"
eztrans-rs = "0.2"
time = { version = "0.3", default-features = false, features = [
    "local-offset",
] }

# Error handling & logging
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
] }

# Async translation support
tokio = { version = "1.53", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
] }
reqwest = { version = "0.13", features = [
    "json",
    "rustls-no-provider",
    "form",
], default-features = false }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
httpdate = "1.0"
quick_cache = { version = "0.7", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
# 최종 GUI 배포물은 증분 빌드보다 실행 성능과 크기를 우선한다.
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[[test]]
name = "file_trans_benchmark"
path = "benchmark/file_trans_test.rs"
required-features = ["benchmark"]
