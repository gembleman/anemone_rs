[package]
name = "anemone_rs"
version = "0.1.0"
edition = "2024"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Com",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectWrite",
    "Foundation_Numerics",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
windows-numerics = "0.3"
windows-core = "0.62"
eztrans-rs = { path = "../eztrans-rs" }
whatlang = "0.18"
isolang = { version = "2.4", features = ["serde", "english_names"] }

# Error handling & logging
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# Async translation support
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "macros"] }
reqwest = { version = "0.13.3", features = ["json", "native-tls", "form"], default-features = false }

[build-dependencies]
winresource = "0.1"
